name: pevie-quality

on:
  pull_request:
    paths:
      - "Pevie Hischer/**"
  push:
    branches: [main]
    paths:
      - "Pevie Hischer/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pevie-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Run package tests
        run: make -f "Pevie Hischer/Makefile" test

      - name: Validate package examples
        run: make -f "Pevie Hischer/Makefile" validate-examples

      - name: Lint DESIGN.md examples
        run: make -f "Pevie Hischer/Makefile" design-lint-examples

      - name: Build review packet
        run: make -f "Pevie Hischer/Makefile" review-packet

      - name: Validate trivial ticket shape sample
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/ticket.md" <<'EOF'
          # Ticket

          ## Implementation Complexity

          Level: trivial
          EOF
          make -f "Pevie Hischer/Makefile" check-planning-brief TICKET="$tmpdir/ticket.md"
