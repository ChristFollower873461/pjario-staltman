name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run core tests
        run: make test

      - name: Run frontend profile tests
        run: make pevie-test

      - name: Validate examples
        run: make validate-examples pevie-validate-examples

      - name: Lint DESIGN.md examples
        run: make pevie-design-lint

      - name: Build core review packet
        run: make review-packet

      - name: Build frontend review packet
        run: make pevie-review-packet

      - name: Validate trivial ticket shape sample
        run: |
          tmpdir="$(mktemp -d)"
          cat > "$tmpdir/ticket.md" <<'EOF'
          # Ticket

          ## Implementation Complexity

          Level: trivial
          EOF
          make check-planning-brief TICKET="$tmpdir/ticket.md"
